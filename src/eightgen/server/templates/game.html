{% extends "base.html" %}

{% block title %}{{ game.title }} — 8Gen{% endblock %}

{% block content %}
<div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
  <div>
    <h1 style="font-size: 24px; font-weight: 700;">{{ game.title }}</h1>
    <p style="color: var(--text-muted); font-size: 14px;">Version {{ game.current_version }} • {{ game.category }}</p>
  </div>
  <div style="display: flex; gap: 10px;">
    <a href="/api/games/{{ game.id }}/download" class="btn-card btn-refine" style="text-decoration: none;" download>
      ⬇ Export HTML
    </a>
    <a href="/" class="btn-card btn-play" style="text-decoration: none;">
      ← Back to Library
    </a>
  </div>
</div>

<div style="height: 70vh; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 35px rgba(0,0,0,0.6);">
  <iframe src="/api/games/{{ game.id }}/play" style="width: 100%; height: 100%; border: none; background: #000;" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>
</div>
{% endblock %}
